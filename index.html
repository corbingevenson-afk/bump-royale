<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060f">
<title>Bump Royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen arena canvas under a thin HUD; menu + lobby are centered cards. Single neon-night theme by choice. */
:root{
  --bg:#07060f; --bg2:#0f0d1f; --fg:#f3f0ff; --mute:#9d97b8; --line:#2a2545;
  --acc:#ff3d7f; --acc2:#3dc8ff; --good:#3dff9a; --warn:#ffd23d;
  --display:'Bungee','Impact',sans-serif; --body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-text-size-adjust:100%;touch-action:none;overscroll-behavior:none}
button,input{font:inherit}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;background:radial-gradient(ellipse at 50% 0%,#1a1434 0%,var(--bg) 60%);touch-action:auto}
.card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;min-width:0}
h1{font-family:var(--display);font-size:clamp(40px,11vw,64px);line-height:.95;margin:0;letter-spacing:.5px;text-align:center;color:#fff;text-shadow:0 0 18px rgba(255,61,127,.75),0 0 40px rgba(61,200,255,.35)}
h1 span{color:var(--acc)}
.tag{color:var(--mute);text-align:center;margin:0;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
input{background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg);font-size:18px;outline:none;min-width:0;width:100%}
input:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(61,200,255,.2)}
input.code{font-family:var(--display);text-transform:uppercase;letter-spacing:.25em;text-align:center;font-size:26px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#fff;background:var(--acc);box-shadow:0 6px 0 #a3194f,0 0 24px rgba(255,61,127,.35);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3194f}
.btn.alt{background:var(--acc2);box-shadow:0 6px 0 #1b6f96,0 0 24px rgba(61,200,255,.3)}
.btn.alt:active{box-shadow:0 2px 0 #1b6f96}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none;color:var(--mute)}
.btn.ghost:active{transform:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{min-height:20px;font-size:14px;color:var(--warn);text-align:center;word-break:break-all}
.codebox{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg2);border:2px dashed var(--line);border-radius:14px;padding:14px}
.codebox small{color:var(--mute);letter-spacing:.2em;text-transform:uppercase;font-size:11px;text-align:center}
.codebox b{font-family:var(--display);font-size:44px;letter-spacing:.2em;color:var(--acc2);text-shadow:0 0 16px rgba(61,200,255,.6)}
ul.players{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
ul.players li{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;min-width:0}
ul.players li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.players i{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
ul.players em{font-style:normal;color:var(--mute);font-size:11px;margin-left:auto;letter-spacing:.1em;flex:none}
.how{font-size:14px;color:var(--mute);line-height:1.5;margin:0}
.how b{color:var(--fg)}
#hud{position:fixed;left:0;right:0;top:0;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none;font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:6px;background:rgba(15,13,31,.8);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;font-weight:700;backdrop-filter:blur(6px)}
.chip i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
.chip.dead{opacity:.4}
.chip b{font-family:var(--display);font-size:13px;margin-left:2px}
#timer{margin-left:auto;font-family:var(--display);font-size:16px;color:var(--mute)}
#dashBtn{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;border:3px solid var(--acc);background:rgba(255,61,127,.18);color:#fff;font-family:var(--display);font-size:15px;letter-spacing:.05em;box-shadow:0 0 24px rgba(255,61,127,.45);touch-action:none;user-select:none;-webkit-user-select:none;display:none;cursor:pointer}
#dashBtn.cd{opacity:.45;border-color:var(--line);box-shadow:none}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;text-align:center;padding-inline:16px}
#overlay .big{font-family:var(--display);font-size:clamp(44px,14vw,120px);line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,61,127,.8),0 0 60px rgba(61,200,255,.4);animation:pop .35s cubic-bezier(.2,1.6,.4,1) both;word-break:break-word}
#overlay .sub{font-size:clamp(15px,4vw,22px);font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
#overlay .sub b{color:var(--fg)}
#leaveBtn{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 12px;font-size:12px;display:none}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mute);font-size:12px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#overlay .big{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<section id="menu" class="screen">
  <div class="card">
    <h1>BUMP<br><span>ROYALE</span></h1>
    <p class="tag">online · one lobby · last one standing</p>
    <label>Your name<input id="name" maxlength="14" autocomplete="off" spellcheck="false"></label>
    <button class="btn" id="createBtn">Create lobby</button>
    <div class="or">or join</div>
    <div class="row">
      <input id="code" class="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn alt" id="joinBtn">Join</button>
    </div>
    <div class="msg" id="menuMsg"></div>
    <p class="how"><b>How it works:</b> move with WASD or drag on the screen, <b>dash</b> with Space or the big button. Knock everyone else out of the ring. The ring shrinks. First to <b>5 wins</b> takes the night.</p>
  </div>
</section>

<section id="lobby" class="screen" hidden>
  <div class="card">
    <h1 style="font-size:36px">LOBBY</h1>
    <div class="codebox"><small>Room code</small><b id="lobbyCode">----</b><small id="lobbyHint">share the code or the link</small></div>
    <div class="row">
      <button class="btn alt" id="shareBtn">Copy invite link</button>
      <button class="btn ghost" id="leaveLobbyBtn">Leave</button>
    </div>
    <ul class="players" id="playerList"></ul>
    <button class="btn" id="startBtn" disabled>Start (need 2 players)</button>
    <div class="msg" id="lobbyMsg"></div>
  </div>
</section>

<div id="hud" hidden><div id="chips" style="display:contents"></div><div id="timer"></div></div>
<div id="overlay" hidden></div>
<button id="dashBtn">DASH</button>
<button id="leaveBtn" class="btn ghost">Leave</button>
<div id="hint" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
'use strict';
// ---------- config ----------
var CFG={R0:320,PR:18,MAXV:280,ACC:11,DASHV:780,DASHT:0.16,DASHCD:1.1,KNOCK:430,SHRINK_DELAY:6,SHRINK_T:40,RMIN:0.2,WINS:5,MAXP:8,TICK:1000/60,SNAP:1000/20,PREFIX:'bumproyale-v1-'};
var COLORS=['#ff3d7f','#3dff9a','#3dc8ff','#ffd23d','#b43dff','#ff7a3d','#3dfff4','#ff5c5c'];
var ADJ=['Neon','Sleepy','Turbo','Spicy','Cosmic','Shadow','Lucky','Wild','Mega','Pixel','Frosty','Hyper'];
var NOUN=['Goose','Otter','Comet','Taco','Panda','Ninja','Yeti','Moth','Shark','Robot','Llama','Ghost'];
var ICE={iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
]};

// ---------- dom ----------
var $=function(id){return document.getElementById(id)};
var el={menu:$('menu'),lobby:$('lobby'),hud:$('hud'),chips:$('chips'),timer:$('timer'),overlay:$('overlay'),dash:$('dashBtn'),leave:$('leaveBtn'),hint:$('hint'),
  name:$('name'),code:$('code'),createBtn:$('createBtn'),joinBtn:$('joinBtn'),menuMsg:$('menuMsg'),lobbyCode:$('lobbyCode'),lobbyHint:$('lobbyHint'),
  shareBtn:$('shareBtn'),leaveLobbyBtn:$('leaveLobbyBtn'),playerList:$('playerList'),startBtn:$('startBtn'),lobbyMsg:$('lobbyMsg')};
var canvas=$('c'),ctx=canvas.getContext('2d');

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function makeCode(){var s='';var L='ABCDEFGHJKLMNPQRSTUVWXYZ';for(var i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cleanName(s){s=String(s||'').replace(/[^\w \-!?.']/g,'').trim().slice(0,14);return s||rnd(ADJ)+' '+rnd(NOUN)}

el.name.value=ls('br-name')||rnd(ADJ)+' '+rnd(NOUN);
var urlCode=(new URLSearchParams(location.search).get('r')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
if(urlCode){el.code.value=urlCode}

// ---------- audio ----------
var AC=null;
function audioOn(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f1,f2,dur,type,vol){if(!AC)return;try{var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02)}catch(e){}}
var SFX={dash:function(){tone(300,900,0.12,'sawtooth',0.06)},bump:function(){tone(180,60,0.12,'square',0.1)},big:function(){tone(120,40,0.25,'square',0.14)},out:function(){tone(600,80,0.5,'sawtooth',0.1)},tick:function(){tone(700,700,0.08,'square',0.06)},go:function(){tone(500,1000,0.25,'square',0.08)},win:function(){tone(523,523,0.12,'square',0.08);setTimeout(function(){tone(659,659,0.12,'square',0.08)},130);setTimeout(function(){tone(784,1046,0.3,'square',0.08)},260)}};
document.addEventListener('pointerdown',audioOn,{passive:true});document.addEventListener('keydown',audioOn);

// ---------- net ----------
var peer=null,isHost=false,conns={},hostConn=null,myId=null,code='';
var state=null; // latest snapshot (host builds it, clients receive it)
var hostSim=null;
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

function setMsg(e,t){e.textContent=t||''}
function show(screen){el.menu.hidden=screen!=='menu';el.lobby.hidden=screen!=='lobby';var g=screen==='game';el.hud.hidden=!g;el.overlay.hidden=!g;el.dash.style.display=g&&isTouch?'block':'none';el.leave.style.display=g?'block':'none';el.hint.hidden=!g}

function destroyPeer(){try{if(peer)peer.destroy()}catch(e){}peer=null;conns={};hostConn=null;if(hostSim){clearInterval(hostSim.tick);clearInterval(hostSim.snap);hostSim=null}state=null;isHost=false;view.ps={};view.order=[]}

function createLobby(){
  audioOn();setMsg(el.menuMsg,'Opening lobby…');el.createBtn.disabled=true;
  var tries=0;
  function attempt(){
    code=makeCode();destroyPeer();
    peer=new Peer(CFG.PREFIX+code,{config:ICE,debug:0});
    var opened=false;
    var to=setTimeout(function(){if(!opened){setMsg(el.menuMsg,'Could not reach the lobby server. Check your connection and try again.');el.createBtn.disabled=false;destroyPeer()}},12000);
    peer.on('open',function(id){opened=true;clearTimeout(to);myId=id;isHost=true;el.createBtn.disabled=false;setMsg(el.menuMsg,'');startHost();enterLobby()});
    peer.on('error',function(err){
      if(err&&err.type==='unavailable-id'&&tries<5){tries++;clearTimeout(to);attempt();return}
      clearTimeout(to);el.createBtn.disabled=false;setMsg(el.menuMsg,'Lobby error: '+(err&&err.type||'unknown')+'. Try again.');
    });
    peer.on('connection',function(c){onHostConnection(c)});
    peer.on('disconnected',function(){try{if(peer)peer.reconnect()}catch(e){}});
  }
  attempt();
}

function joinLobby(){
  audioOn();var c=(el.code.value||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(c.length!==4){setMsg(el.menuMsg,'Enter the 4-letter room code.');return}
  code=c;setMsg(el.menuMsg,'Joining '+c+'…');el.joinBtn.disabled=true;destroyPeer();
  peer=new Peer(undefined,{config:ICE,debug:0});
  var opened=false;
  var to=setTimeout(function(){if(!opened){setMsg(el.menuMsg,'Could not connect. Check the code and your connection.');el.joinBtn.disabled=false;destroyPeer()}},15000);
  peer.on('open',function(id){
    myId=id;
    hostConn=peer.connect(CFG.PREFIX+code,{reliable:true,serialization:'json'});
    hostConn.on('open',function(){opened=true;clearTimeout(to);el.joinBtn.disabled=false;setMsg(el.menuMsg,'');hostConn.send({t:'hi',name:cleanName(el.name.value)});enterLobby()});
    hostConn.on('data',function(d){onClientData(d)});
    hostConn.on('close',function(){hostGone()});
    hostConn.on('error',function(){hostGone()});
  });
  peer.on('error',function(err){
    clearTimeout(to);el.joinBtn.disabled=false;
    var t=err&&err.type;
    setMsg(el.menuMsg,t==='peer-unavailable'?'No lobby with code '+code+'.':'Connection error: '+(t||'unknown')+'.');
    destroyPeer();
  });
}

function hostGone(){
  if(!peer)return;
  destroyPeer();show('menu');setMsg(el.menuMsg,'The host left the lobby.');
}

function enterLobby(){
  ls('br-name',cleanName(el.name.value));
  el.lobbyCode.textContent=code;
  el.lobbyHint.textContent=isHost?'share the code or the link, then press start':'waiting for the host to start';
  el.startBtn.style.display=isHost?'block':'none';
  el.playerList.innerHTML='';
  setMsg(el.lobbyMsg,'');
  show('lobby');
  try{history.replaceState(null,'',location.pathname+'?r='+code)}catch(e){}
}

function inviteLink(){return location.origin+location.pathname+'?r='+code}

// ---------- host simulation ----------
function startHost(){
  var H={players:{},order:[],phase:'lobby',t:0,R:CFG.R0,roundT:0,phaseT:0,winner:null,events:[],last:performance.now()};
  hostSim=H;
  addPlayer(myId,cleanName(el.name.value));
  H.tick=setInterval(hostStep,CFG.TICK);
  H.snap=setInterval(hostSnapshot,CFG.SNAP);
}
function addPlayer(id,name){
  var H=hostSim;if(!H||H.players[id])return;
  var used={};H.order.forEach(function(i){used[H.players[i].color]=1});
  var color=COLORS.filter(function(c){return !used[c]})[0]||rnd(COLORS);
  H.players[id]={id:id,name:name,color:color,x:0,y:0,vx:0,vy:0,fx:0,fy:-1,ix:0,iy:0,dashReq:0,dashSeen:0,dash:0,cd:0,alive:false,wins:0};
  H.order.push(id);
  if(H.phase==='lobby')placeLobby();
}
function removePlayer(id){var H=hostSim;if(!H||!H.players[id])return;delete H.players[id];H.order=H.order.filter(function(i){return i!==id});if(H.phase==='play')checkRound(true)}
function onHostConnection(c){
  c.on('open',function(){
    if(!hostSim){try{c.close()}catch(e){}return}
    if(hostSim.order.length>=CFG.MAXP){try{c.send({t:'full'})}catch(e){}setTimeout(function(){try{c.close()}catch(e){}},300);return}
    conns[c.peer]=c;
  });
  c.on('data',function(d){
    if(!d||typeof d!=='object')return;
    if(d.t==='hi'){if(hostSim&&conns[c.peer])addPlayer(c.peer,cleanName(d.name))}
    else if(d.t==='i'){var p=hostSim&&hostSim.players[c.peer];if(p){p.ix=clamp(+d.x||0,-1,1);p.iy=clamp(+d.y||0,-1,1);p.dashReq=(+d.d)|0}}
  });
  c.on('close',function(){delete conns[c.peer];removePlayer(c.peer)});
  c.on('error',function(){delete conns[c.peer];removePlayer(c.peer)});
}
function placeLobby(){var H=hostSim;spawnRing();H.order.forEach(function(id){H.players[id].alive=true})}
function spawnRing(){
  var H=hostSim,n=H.order.length;
  H.order.forEach(function(id,i){var p=H.players[id],a=-Math.PI/2+i*(Math.PI*2/Math.max(n,1));var r=n===1?0:CFG.R0*0.6;p.x=Math.cos(a)*r;p.y=Math.sin(a)*r;p.vx=p.vy=0;p.dash=0;p.cd=0;p.alive=true;p.fx=-Math.cos(a);p.fy=-Math.sin(a)});
}
function beginRound(){var H=hostSim;spawnRing();H.phase='countdown';H.phaseT=3.2;H.R=CFG.R0;H.winner=null;H.events.push({k:'tick'})}
function hostStartMatch(){var H=hostSim;if(!H||H.order.length<2||H.phase!=='lobby')return;H.order.forEach(function(id){H.players[id].wins=0});beginRound();show('game')}
function checkRound(force){
  var H=hostSim;if(H.phase!=='play')return;
  var alive=H.order.filter(function(id){return H.players[id].alive});
  var n=H.order.length;
  if((n>=2&&alive.length<=1)||(n<2&&alive.length===0)||(force&&alive.length<=1)){
    H.phase='roundEnd';H.phaseT=3;H.winner=alive[0]||null;
    if(H.winner){H.players[H.winner].wins++;H.events.push({k:'win'});if(H.players[H.winner].wins>=CFG.WINS){H.phase='matchEnd';H.phaseT=6}}
  }
}
function hostStep(){
  var H=hostSim,now=performance.now(),dt=Math.min(0.05,(now-H.last)/1000);H.last=now;
  if(H.phase==='lobby'){return}
  if(H.phase==='countdown'){var before=Math.ceil(H.phaseT);H.phaseT-=dt;if(Math.ceil(H.phaseT)!==before&&H.phaseT>0)H.events.push({k:'tick'});if(H.phaseT<=0){H.phase='play';H.roundT=0;H.events.push({k:'go'})}return}
  if(H.phase==='roundEnd'||H.phase==='matchEnd'){H.phaseT-=dt;simMove(dt,true);if(H.phaseT<=0){if(H.phase==='matchEnd'){H.phase='lobby';H.R=CFG.R0;placeLobby();show('lobby')}else beginRound()}return}
  // play
  H.roundT+=dt;
  var e=H.roundT-CFG.SHRINK_DELAY;H.R=CFG.R0*(e<=0?1:Math.max(CFG.RMIN,1-e/CFG.SHRINK_T));
  simMove(dt,false);
  H.order.forEach(function(id){var p=H.players[id];if(p.alive&&Math.hypot(p.x,p.y)>H.R+CFG.PR*0.55){p.alive=false;p.vx*=0.3;p.vy*=0.3;H.events.push({k:'out',x:p.x,y:p.y,c:p.color})}});
  checkRound(false);
}
function simMove(dt,frozen){
  var H=hostSim,ids=H.order,i,j;
  for(i=0;i<ids.length;i++){var p=H.players[ids[i]];if(!p.alive){p.x+=p.vx*dt;p.y+=p.vy*dt;continue}
    p.cd-=dt;
    if(!frozen&&p.dashReq!==p.dashSeen){p.dashSeen=p.dashReq;if(p.cd<=0){var dx=p.ix,dy=p.iy,l=Math.hypot(dx,dy);if(l<0.2){dx=p.fx;dy=p.fy;l=Math.hypot(dx,dy)||1}p.vx=dx/l*CFG.DASHV;p.vy=dy/l*CFG.DASHV;p.dash=CFG.DASHT;p.cd=CFG.DASHCD;H.events.push({k:'dash'})}}
    if(p.dash>0){p.dash-=dt}else{var tx=frozen?0:p.ix*CFG.MAXV,ty=frozen?0:p.iy*CFG.MAXV;var il=Math.hypot(p.ix,p.iy);if(il>1){tx/=il;ty/=il}var k=Math.min(1,CFG.ACC*dt);p.vx+=(tx-p.vx)*k;p.vy+=(ty-p.vy)*k;if(il>0.2){p.fx=p.ix/il;p.fy=p.iy/il}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(i=0;i<ids.length;i++)for(j=i+1;j<ids.length;j++){
    var a=H.players[ids[i]],b=H.players[ids[j]];if(!a.alive||!b.alive)continue;
    var ddx=b.x-a.x,ddy=b.y-a.y,d=Math.hypot(ddx,ddy);if(d===0){ddx=0.01;d=0.01}
    if(d<CFG.PR*2){var nx=ddx/d,ny=ddy/d,ov=(CFG.PR*2-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      var rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rel>0){var jimp=rel*0.95;a.vx-=nx*jimp;a.vy-=ny*jimp;b.vx+=nx*jimp;b.vy+=ny*jimp;var big=false;
        if(a.dash>0){b.vx+=nx*CFG.KNOCK;b.vy+=ny*CFG.KNOCK;a.vx*=0.35;a.vy*=0.35;a.dash=0;big=true}
        if(b.dash>0){a.vx-=nx*CFG.KNOCK;a.vy-=ny*CFG.KNOCK;b.vx*=0.35;b.vy*=0.35;b.dash=0;big=true}
        H.events.push({k:big?'big':'bump',x:(a.x+b.x)/2,y:(a.y+b.y)/2})}
    }
  }
}
function hostSnapshot(){
  var H=hostSim;if(!H)return;
  var s={t:'s',ph:H.phase,pt:Math.max(0,H.phaseT),rt:H.roundT,R:H.R,w:H.winner,ev:H.events,ps:H.order.map(function(id){var p=H.players[id];return [id,Math.round(p.x*10)/10,Math.round(p.y*10)/10,Math.round(p.vx),Math.round(p.vy),p.alive?1:0,p.wins,p.dash>0?1:0,p.name,p.color,Math.round(clamp(p.cd/CFG.DASHCD,0,1)*100)]})};
  H.events=[];
  var k;for(k in conns){var c=conns[k];if(c.open){try{c.send(s)}catch(e){}}}
  applySnapshot(s);
}

// ---------- client ----------
function onClientData(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='s')applySnapshot(d);
  else if(d.t==='full'){destroyPeer();show('menu');setMsg(el.menuMsg,'That lobby is full (8 players).')}
}
var view={ps:{},order:[],phase:'lobby',R:CFG.R0,fx:[]};
function applySnapshot(s){
  state=s;
  var seen={};
  s.ps.forEach(function(a){var id=a[0],v=view.ps[id];if(!v){v=view.ps[id]={id:id,dx:a[1],dy:a[2],fall:0}}
    v.x=a[1];v.y=a[2];v.vx=a[3];v.vy=a[4];v.alive=!!a[5];v.wins=a[6];v.dash=!!a[7];v.name=a[8];v.color=a[9];v.cd=a[10]/100;seen[id]=1;
    if(v.alive)v.fall=0;else if(v.fall===0&&s.ph!=='lobby')v.fall=0.001;
    if(s.ph==='lobby'||s.ph==='countdown'){v.dx=v.x;v.dy=v.y}});
  Object.keys(view.ps).forEach(function(id){if(!seen[id])delete view.ps[id]});
  view.order=s.ps.map(function(a){return a[0]});view.R=s.R;view.phase=s.ph;
  (s.ev||[]).forEach(function(e){
    if(e.k==='dash')SFX.dash();else if(e.k==='bump'){SFX.bump();spawnFx(e.x,e.y,'#ffffff',6)}else if(e.k==='big'){SFX.big();spawnFx(e.x,e.y,'#ffd23d',14);shake=8}else if(e.k==='out'){SFX.out();spawnFx(e.x,e.y,e.c,18)}else if(e.k==='tick')SFX.tick();else if(e.k==='go')SFX.go();else if(e.k==='win')SFX.win();
  });
  if(!isHost){
    if(s.ph==='lobby'&&el.lobby.hidden)show('lobby');
    else if(s.ph!=='lobby'&&el.hud.hidden)show('game');
  }
  if(s.ph==='lobby'&&!el.lobby.hidden)renderLobby();
  renderHud();
}
var lobbyCache='';
function renderLobby(){
  var html='';view.order.forEach(function(id,i){var v=view.ps[id];html+='<li><i style="color:'+v.color+';background:'+v.color+'"></i><span>'+esc(v.name)+'</span><em>'+(i===0?'HOST':'')+(id===myId?(i===0?' · YOU':'YOU'):'')+'</em></li>'});
  if(html!==lobbyCache){lobbyCache=html;el.playerList.innerHTML=html}
  var n=view.order.length;el.startBtn.disabled=n<2;el.startBtn.textContent=n<2?'Start (need 2 players)':'Start · '+n+' players';
}
var hudCache='',lastOv='';
function renderHud(){
  var s=state;if(!s)return;
  var html='';view.order.forEach(function(id){var v=view.ps[id];html+='<div class="chip'+(v.alive?'':' dead')+'"><i style="color:'+v.color+';background:'+v.color+'"></i>'+esc(v.name)+'<b>'+v.wins+'</b></div>'});
  if(html!==hudCache){hudCache=html;el.chips.innerHTML=html}
  el.timer.textContent=s.ph==='play'?Math.floor(s.rt)+'s':'';
  var ov='';
  if(s.ph==='countdown'){var n=Math.ceil(s.pt);ov='<div class="big">'+(n>0?n:'GO')+'</div><div class="sub">Round · first to '+CFG.WINS+' wins</div>'}
  else if(s.ph==='play'&&s.rt<1.2)ov='<div class="big">GO!</div>';
  else if(s.ph==='roundEnd'){var w=s.w&&view.ps[s.w];ov=w?'<div class="big" style="color:'+w.color+'">'+esc(w.name)+'</div><div class="sub">survives · <b>'+w.wins+'</b> / '+CFG.WINS+'</div>':'<div class="big">DRAW</div><div class="sub">everyone fell</div>'}
  else if(s.ph==='matchEnd'){var mw=s.w&&view.ps[s.w];ov=mw?'<div class="big" style="color:'+mw.color+'">'+esc(mw.name)+'</div><div class="sub"><b>wins the night</b> · back to lobby in '+Math.ceil(s.pt)+'</div>':''}
  else if(s.ph==='play'){var me=view.ps[myId];if(me&&!me.alive)ov='<div class="sub">you\'re out · watch the chaos</div>'}
  if(ov!==lastOv){lastOv=ov;el.overlay.innerHTML=ov}
  var me2=view.ps[myId];el.dash.classList.toggle('cd',!!(me2&&me2.cd>0.02));
  el.hint.textContent=isTouch?'drag to move · tap dash':'wasd / arrows to move · space to dash';
}

// ---------- input ----------
var input={x:0,y:0,d:0},keys={},lastSent={x:0,y:0,d:0,at:0};
function sendInput(force){
  var now=performance.now();
  if(!force&&input.x===lastSent.x&&input.y===lastSent.y&&input.d===lastSent.d&&now-lastSent.at<400)return;
  lastSent={x:input.x,y:input.y,d:input.d,at:now};
  if(isHost){var p=hostSim&&hostSim.players[myId];if(p){p.ix=input.x;p.iy=input.y;p.dashReq=input.d}}
  else if(hostConn&&hostConn.open){try{hostConn.send({t:'i',x:input.x,y:input.y,d:input.d})}catch(e){}}
}
function keyVec(){var x=0,y=0;if(keys.a||keys.ArrowLeft)x-=1;if(keys.d||keys.ArrowRight)x+=1;if(keys.w||keys.ArrowUp)y-=1;if(keys.s||keys.ArrowDown)y+=1;input.x=x;input.y=y}
var MOVEKEYS={a:1,s:1,d:1,w:1,ArrowLeft:1,ArrowRight:1,ArrowUp:1,ArrowDown:1};
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT')return;
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===' '||k==='Shift'){if(!keys.space){keys.space=1;input.d++;sendInput(true)}e.preventDefault();return}
  if(MOVEKEYS[k]){keys[k]=1;keyVec();e.preventDefault()}
});
document.addEventListener('keyup',function(e){var k=e.key.length===1?e.key.toLowerCase():e.key;if(k===' '||k==='Shift'){keys.space=0;return}if(keys[k]){keys[k]=0;keyVec()}});
window.addEventListener('blur',function(){keys={};input.x=0;input.y=0});
// touch joystick on canvas
var joy=null;
canvas.addEventListener('pointerdown',function(e){if(el.hud.hidden||joy)return;joy={id:e.pointerId,sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY};try{canvas.setPointerCapture(e.pointerId)}catch(err){}},{passive:true});
canvas.addEventListener('pointermove',function(e){if(!joy||e.pointerId!==joy.id)return;var dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,l=Math.hypot(dx,dy),m=48;if(l>m){dx=dx/l*m;dy=dy/l*m}input.x=Math.abs(dx)<6?0:dx/m;input.y=Math.abs(dy)<6?0:dy/m;joy.cx=e.clientX;joy.cy=e.clientY},{passive:true});
function joyEnd(e){if(joy&&e.pointerId===joy.id){joy=null;input.x=0;input.y=0}}
canvas.addEventListener('pointerup',joyEnd);canvas.addEventListener('pointercancel',joyEnd);
el.dash.addEventListener('pointerdown',function(e){e.preventDefault();input.d++;sendInput(true)});
el.dash.addEventListener('contextmenu',function(e){e.preventDefault()});
setInterval(function(){sendInput(false)},50);

// ---------- render ----------
var W=0,H=0,DPR=1,shake=0,lastFrame=performance.now();
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',resize);resize();
function spawnFx(x,y,color,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=80+Math.random()*260;view.fx.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5+Math.random()*0.4,c:color})}}
function draw(){
  requestAnimationFrame(draw);
  var now=performance.now(),dt=Math.min(0.05,(now-lastFrame)/1000);lastFrame=now;
  var inGame=!el.hud.hidden;
  ctx.fillStyle='#07060f';ctx.fillRect(0,0,W,H);
  if(!inGame||!state)return;
  var sc=Math.min(W,H)*0.44/CFG.R0,cx=W/2,cy=H/2+10;
  if(shake>0){cx+=(Math.random()-0.5)*shake;cy+=(Math.random()-0.5)*shake;shake=Math.max(0,shake-40*dt)}
  ctx.fillStyle='rgba(255,255,255,0.05)';for(var gx=(cx%40);gx<W;gx+=40)for(var gy=(cy%40);gy<H;gy+=40){ctx.fillRect(gx-1,gy-1,2,2)}
  var R=view.R*sc,danger=1-view.R/CFG.R0;
  var g=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R);g.addColorStop(0,'#1a1636');g.addColorStop(1,'#120f26');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  var edge=danger<0.5?'rgba(61,200,255,0.9)':'rgba(255,61,127,0.95)';
  ctx.lineWidth=4;ctx.strokeStyle=edge;ctx.shadowColor=edge;ctx.shadowBlur=22;ctx.stroke();ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(cx,cy,R*0.985,0,Math.PI*2);ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.stroke();
  for(var i=view.fx.length-1;i>=0;i--){var f=view.fx[i];f.life-=dt;if(f.life<=0){view.fx.splice(i,1);continue}f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.96;f.vy*=0.96;ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(cx+f.x*sc,cy+f.y*sc,3,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  var k=Math.min(1,18*dt);
  view.order.forEach(function(id){
    var v=view.ps[id];
    v.dx+=(v.x-v.dx)*k;v.dy+=(v.y-v.dy)*k;
    var px=cx+v.dx*sc,py=cy+v.dy*sc,r=CFG.PR*sc,alpha=1,scale=1;
    if(!v.alive){if(view.phase==='lobby')return;v.fall+=dt;if(v.fall>0.8)return;alpha=1-v.fall/0.8;scale=1-v.fall/0.9}
    ctx.globalAlpha=alpha;
    var spd=Math.hypot(v.vx,v.vy);
    if(spd>320){for(var t=1;t<=3;t++){ctx.globalAlpha=alpha*(0.25-t*0.06);ctx.fillStyle=v.color;ctx.beginPath();ctx.arc(px-v.vx/spd*t*r*0.9,py-v.vy/spd*t*r*0.9,r*scale*(1-t*0.12),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=alpha}
    ctx.shadowColor=v.color;ctx.shadowBlur=v.dash?30:14;ctx.fillStyle=v.color;ctx.beginPath();ctx.arc(px,py,r*scale,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.lineWidth=v.dash?4:2.5;ctx.strokeStyle=v.dash?'#fff':'rgba(0,0,0,0.45)';ctx.stroke();
    if(spd>5){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.arc(px+v.vx/spd*r*0.45,py+v.vy/spd*r*0.45,r*0.22,0,Math.PI*2);ctx.fill()}
    ctx.font='700 '+Math.max(11,r*0.75)+'px "Chakra Petch", sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillStyle=id===myId?'#fff':'rgba(243,240,255,0.8)';ctx.fillText((id===myId?'▼ ':'')+v.name,px,py-r*scale-6);
    if(id===myId&&v.alive&&v.cd>0.02){ctx.beginPath();ctx.arc(px,py,r*scale+5,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-v.cd));ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.stroke()}
    ctx.globalAlpha=1;
  });
  if(joy){ctx.globalAlpha=0.35;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.sx,joy.sy,48,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';var jx=joy.cx-joy.sx,jy=joy.cy-joy.sy,jl=Math.hypot(jx,jy);if(jl>48){jx=jx/jl*48;jy=jy/jl*48}ctx.beginPath();ctx.arc(joy.sx+jx,joy.sy+jy,18,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
requestAnimationFrame(draw);

// ---------- buttons ----------
el.createBtn.addEventListener('click',createLobby);
el.joinBtn.addEventListener('click',joinLobby);
el.code.addEventListener('keydown',function(e){if(e.key==='Enter')joinLobby()});
el.name.addEventListener('keydown',function(e){if(e.key==='Enter')createLobby()});
el.startBtn.addEventListener('click',function(){audioOn();hostStartMatch()});
function leaveAll(){destroyPeer();show('menu');setMsg(el.menuMsg,'');try{history.replaceState(null,'',location.pathname)}catch(e){}}
el.leaveLobbyBtn.addEventListener('click',leaveAll);
el.leave.addEventListener('click',leaveAll);
el.shareBtn.addEventListener('click',function(){
  var link=inviteLink(),done=function(){el.shareBtn.textContent='Link copied!';setTimeout(function(){el.shareBtn.textContent='Copy invite link'},1600)};
  if(navigator.share){navigator.share({title:'Bump Royale',text:'Join my lobby, code '+code,url:link}).then(done).catch(function(){})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(done).catch(function(){setMsg(el.lobbyMsg,link)})}
  else setMsg(el.lobbyMsg,link);
});
show('menu');
if(urlCode)setMsg(el.menuMsg,'Invite found · press Join');
})();
</script>
